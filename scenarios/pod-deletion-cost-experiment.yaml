study:
  name: pod-deletion-cost-experiment
  runs: 1000
  time_mode: wall_clock
  catalog_provider: kwok

  cluster:
    node_pools:
      - instance_types: all-kwok
        min_nodes: 0
        max_nodes: 1000
        karpenter:
          consolidation: {policy: WhenUnderutilized}

  workloads:
    # Deployment A: 500 → 350 → 10
    - type: web_app
      count: 1
      replicas: {fixed: 1}
      cpu_request: {dist: uniform, min: "950m", max: "950m"}
      memory_request: {dist: uniform, min: "3.5Gi", max: "3.5Gi"}
      scale_up:
        - {at: "10s", increase_to: 500}
      scale_down:
        - {at: "15m", reduce_by: 150}
        - {at: "25m", reduce_by: 340}

    # Deployment B: 500 → 350 → 10
    - type: web_app
      count: 1
      replicas: {fixed: 1}
      cpu_request: {dist: uniform, min: "950m", max: "950m"}
      memory_request: {dist: uniform, min: "6.5Gi", max: "6.5Gi"}
      scale_up:
        - {at: "10s", increase_to: 500}
      scale_down:
        - {at: "15m", reduce_by: 150}
        - {at: "25m", reduce_by: 340}

  measurement_windows:
    - name: transition-500-to-350
      start: "15m"
      end: "25m"
      description: "Partial scale-down: consolidation should activate"
    - name: transition-350-to-10
      start: "25m"
      end: "40m"
      description: "Near-empty scale-down: emptiness method should dominate"

  variants:
    - name: baseline_none
      deletion_cost_strategy: none
    - name: pod_deletion_cost_controller
      deletion_cost_strategy: pod_deletion_cost_controller

  metrics:
    compare:
      - disruption_count
      - total_cost
      - p99_scheduling_latency
